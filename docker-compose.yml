services:
    web:
        build:
            context: .
            dockerfile: docker/dockerfile.client
        ports:
            - "8020:80"
        depends_on:
            - pocketbase

    pocketbase:
        build:
            context: .
            dockerfile: docker/dockerfile.api
            args:
                PB_VERSION: "0.30.0"
        environment:
            PB_ADMIN_EMAIL: "admin@admin.com"
            PB_ADMIN_PASSWORD: "admin123"
        ports:
            - "8021:8090"
        volumes:
            - /server/pb_data:/pb/pb_data
            - /server/pb_migrations:/pb/pb_migrations:ro
            - /server/pb_hooks:/pb/pb_hooks:ro
